name: guitar-vibe-dev
services:
  app:
    build: .
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ./app:/app/app:ro
      - ./components:/app/components:ro
      - ./lib:/app/lib:ro
      - ./types:/app/types:ro
      - ./public:/app/public:ro
      - vibes-data:/app/data
      - ./evals:/app/evals
      - next-cache:/app/.next
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
  ollama:
    image: ollama/ollama:0.40.2
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 3s
      retries: 12
  model-prepare:
    image: node:22.22.2-bookworm-slim
    profiles: [setup]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    volumes:
      - ./scripts/check-model.mjs:/check-model.mjs:ro
    command: [node, /check-model.mjs]
volumes:
  ollama-models:
  vibes-data:
  next-cache:
